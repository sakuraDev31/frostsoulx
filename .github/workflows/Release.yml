name: Build Release APK (arm64)

on:
  workflow_dispatch:
  push:

permissions:
  contents: write
  actions: write

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseG1GC -XX:MaxMetaspaceSize=512m"
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.configureondemand=true
    -Dorg.gradle.caching=true

jobs:
  build_release:
    name: Build Release APK (arm64)
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleGmsMobileArm64Release --no-daemon --build-cache --debug --stacktrace --console=plain
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}

      - name: Resolve release output directory
        id: release_dir
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATES=(
            "app/build/outputs/apk/gmsMobileArm64/release"
            "app/build/outputs/apk/gms/mobile/arm64/release"
            "app/build/outputs/apk/mobile/arm64/release"
            "app/build/outputs/apk/mobileArm64/release"
          )

          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ]; then
              echo "release_dir=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          FOUND_METADATA="$(
            find app/build/outputs/apk \
              -type f \
              -name "output-metadata.json" \
              \( \
                -path "*/gmsMobileArm64/release/output-metadata.json" -o \
                -path "*/gms/mobile/arm64/release/output-metadata.json" -o \
                -path "*/mobile/arm64/release/output-metadata.json" -o \
                -path "*/mobileArm64/release/output-metadata.json" \
              \) | head -n 1 || true
          )"

          if [ -n "${FOUND_METADATA:-}" ]; then
            echo "release_dir=$(dirname "$FOUND_METADATA")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Could not resolve APK release output directory."
          find app/build/outputs/apk -maxdepth 8 -type d -print || true
          exit 1

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: ${{ steps.release_dir.outputs.release_dir }}/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Move signed APK
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="${{ steps.release_dir.outputs.release_dir }}"
          mkdir -p "$RELEASE_DIR/out"

          SIGNED_APK=$(find "$RELEASE_DIR" -type f \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \) | head -n 1)

          if [ -z "${SIGNED_APK:-}" ]; then
            echo "Signed APK not found."
            find "$RELEASE_DIR" -type f -name "*.apk" -print || true
            exit 1
          fi

          mv "$SIGNED_APK" "$RELEASE_DIR/out/app-gms-mobile-arm64-release.apk"

      - name: Report APK size
        shell: bash
        run: |
          APK_PATH="${{ steps.release_dir.outputs.release_dir }}/out/app-gms-mobile-arm64-release.apk"
          SIZE_MB=$(du -m "$APK_PATH" | cut -f1)
          echo "::notice::APK Size: ${SIZE_MB}MB"
          echo "apk_size_mb=${SIZE_MB}" >> "$GITHUB_ENV"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v7
        with:
          name: app-gms-mobile-arm64-release
          path: ${{ steps.release_dir.outputs.release_dir }}/out/app-gms-mobile-arm64-release.apk
